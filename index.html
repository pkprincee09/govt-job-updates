<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Latest Government Jobs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .job-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .job-card h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .job-info {
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .apply-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 7px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>📢 Latest Government Jobs</h1>
  <p>Latest Government Job Updates</p>
</header>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Search Government Jobs..."
  >

  <div id="jobs">
    Loading jobs...
  </div>

</div>

<footer>
  © 2026 Latest Government Jobs
</footer>


<script>

async function loadJobs() {

  try {

    const response = await fetch("jobs.json");

    const jobs = await response.json();

    const container = document.getElementById("jobs");

    container.innerHTML = jobs.map(job => `

      <div class="job-card">

        <h2>🔥 ${job.title}</h2>

        <div class="job-info">

          <p><strong>🏢 Organization:</strong>
            ${job.organization}
          </p>

          <p><strong>👥 Vacancy:</strong>
            ${job.vacancy}
          </p>

          <p><strong>📅 Start Date:</strong>
            ${job.startDate}
          </p>

          <p><strong>⏰ Last Date:</strong>
            ${job.lastDate}
          </p>

          <p><strong>💰 Application Fee:</strong>
            ${job.fee}
          </p>

          <p><strong>🎓 Qualification:</strong>
            ${job.qualification}
          </p>

          <p><strong>🎂 Age Limit:</strong>
            ${job.age}
          </p>

        </div>

        <a
          href="${job.applyLink}"
          class="apply-btn"
          target="_blank"
        >
          Official Apply Link →
        </a>

      </div>

    `).join("");


    // Search

    document
      .getElementById("search")
      .addEventListener("input", function() {

        const value = this.value.toLowerCase();

        document
          .querySelectorAll(".job-card")
          .forEach(card => {

            card.style.display =
              card.innerText
                .toLowerCase()
                .includes(value)
                ? "block"
                : "none";

          });

      });


  } catch (error) {

    document.getElementById("jobs").innerHTML =
      "❌ Jobs load नहीं हो पाए।";

  }

}

loadJobs();

</script>

</body>
</html>
