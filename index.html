<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Latest Government Jobs</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #status {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .job-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .job-card h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .job-info {
      line-height: 1.8;
      margin-bottom: 15px;
    }

    .apply-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 7px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>📢 Latest Government Jobs</h1>
  <p>Latest Government Job Updates</p>
</header>

<div class="container">

  <input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Search Government Jobs..."
  >

  <div id="jobs">
    <div id="status">⏳ Loading latest government jobs...</div>
  </div>

</div>

<footer>
  © 2026 Latest Government Jobs
</footer>

<script>

async function loadJobs() {

  const container = document.getElementById("jobs");

  try {

    /*
      GitHub Pages compatible path.
      This automatically uses the same folder
      where index.html is hosted.
    */

    const jsonUrl =
      new URL("jobs.json", window.location.href).href +
      "?v=" + Date.now();

    const response = await fetch(jsonUrl, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "jobs.json not found. HTTP " + response.status
      );
    }

    const jobs = await response.json();

    if (!Array.isArray(jobs)) {
      throw new Error("jobs.json format is not an array");
    }

    if (jobs.length === 0) {

      container.innerHTML = `
        <div id="status">
          📭 अभी कोई government job available नहीं है।
        </div>
      `;

      return;
    }

    renderJobs(jobs);

  } catch (error) {

    console.error("Jobs loading error:", error);

    container.innerHTML = `
      <div id="status">
        ❌ Jobs load नहीं हो पाए।<br><br>
        <small>
          Data file check करें: jobs.json
        </small>
      </div>
    `;
  }
}


function renderJobs(jobs) {

  const container = document.getElementById("jobs");

  container.innerHTML = jobs.map(job => `

    <div class="job-card">

      <h2>🔥 ${escapeHTML(job.title || "Government Job")}</h2>

      <div class="job-info">

        <p>
          <strong>🏢 Organization:</strong>
          ${escapeHTML(job.organization || "Not Available")}
        </p>

        <p>
          <strong>👥 Vacancy:</strong>
          ${escapeHTML(job.vacancy || "Not Available")}
        </p>

        <p>
          <strong>📅 Start Date:</strong>
          ${escapeHTML(job.startDate || "Not Available")}
        </p>

        <p>
          <strong>⏰ Last Date:</strong>
          ${escapeHTML(job.lastDate || "Not Available")}
        </p>

        <p>
          <strong>💰 Application Fee:</strong>
          ${escapeHTML(job.fee || "Not Available")}
        </p>

        <p>
          <strong>🎓 Qualification:</strong>
          ${escapeHTML(job.qualification || "Not Available")}
        </p>

        <p>
          <strong>🎂 Age Limit:</strong>
          ${escapeHTML(job.age || "Not Available")}
        </p>

      </div>

      ${
        job.applyLink
        ? `
          <a
            href="${escapeAttribute(job.applyLink)}"
            class="apply-btn"
            target="_blank"
            rel="noopener noreferrer"
          >
            Official Apply Link →
          </a>
        `
        : `
          <span>
            Apply link not available
          </span>
        `
      }

    </div>

  `).join("");

  setupSearch();
}


function setupSearch() {

  const search = document.getElementById("search");

  search.addEventListener("input", function() {

    const value = this.value.toLowerCase().trim();

    document
      .querySelectorAll(".job-card")
      .forEach(card => {

        card.style.display =
          card.innerText.toLowerCase().includes(value)
          ? "block"
          : "none";

      });

  });
}


function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return String(value)
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


loadJobs();

</script>

</body>
</html>
